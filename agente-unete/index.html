<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Únete a la comunidad de agentes | W Real Estate</title>
  <meta name="description" content="Únete a la comunidad de WhatsApp de W Real Estate. Allí compartiremos el día, la hora y el enlace de Google Meet para las entrevistas.">
  <meta name="theme-color" content="#F6EFE3">
  <link rel="canonical" href="https://wrealestate.es/agente-unete/">
  <link rel="icon" type="image/png" href="/w-logo-tinta.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="W Real Estate">
  <meta property="og:title" content="Únete a la comunidad de agentes | W Real Estate">
  <meta property="og:description" content="En nuestra comunidad de WhatsApp informaremos del día y la hora de las entrevistas y compartiremos el enlace de Google Meet.">
  <meta property="og:url" content="https://wrealestate.es/agente-unete/">
  <meta property="og:image" content="https://wrealestate.es/w-logo-tinta.png">
  <meta property="og:image:alt" content="W Real Estate">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Lato:wght@0,400;0,700&display=swap" rel="stylesheet">
  <style>
    :root { --white:#FFFFFF; --champagne:#F6EFE3; --cream:#EDD7BF; --ink:#1E1A17; --wine:#7A2027; --wine-hover:#5E171E; --muted:#5C534B; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:48px 24px; background:var(--champagne); color:var(--ink); font-family:'Lato',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    ::selection { background:var(--cream); color:var(--ink); }
    .invitation { width:min(760px,100%); padding:56px 64px 64px; background:var(--white); border-top:3px solid var(--wine); text-align:center; }
    .logo { display:block; width:82px; height:auto; margin:0 auto 32px; }
    .eyebrow { margin:0 0 20px; color:var(--wine); font-size:11px; font-weight:700; line-height:1.6; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:clamp(40px,4.8vw,60px); line-height:1.06; letter-spacing:-.035em; }
    h1 em { color:var(--wine); font-weight:400; }
    .intro { max-width:34em; margin:24px auto 32px; color:var(--muted); font-size:16px; line-height:1.8; }
    .intro p { margin:0; }
    .intro p + p { margin-top:12px; }
    .community-link { display:inline-flex; align-items:center; justify-content:center; gap:22px; min-height:56px; max-width:100%; padding:16px 28px; background:var(--wine); color:var(--white); text-decoration:none; font-size:14px; font-weight:700; line-height:1.5; transition:background .15s; }
    .community-link:hover { background:var(--wine-hover); }
    .community-link:focus-visible { outline:3px solid var(--wine); outline-offset:5px; }
    .community-link span { font-size:21px; line-height:1; }
    @media (max-width:600px) {
      body { padding:24px 16px; }
      .invitation { padding:36px 24px 40px; }
      .logo { width:72px; margin-bottom:28px; }
      .eyebrow { margin-bottom:18px; font-size:10px; }
      h1 { font-size:clamp(36px,9.5vw,48px); }
      .intro { margin-block:22px 28px; font-size:15px; }
      .community-link { width:100%; padding-inline:20px; gap:16px; }
    }
    @media (prefers-reduced-motion:reduce) { .community-link { transition:none; } }
  </style>
</head>
<body>
  <main class="invitation" aria-labelledby="titulo">
    <img class="logo" src="/w-logo-tinta.png" alt="W Real Estate" width="562" height="480">
    <p class="eyebrow">Comunidad de agentes</p>
    <h1 id="titulo">Únete a nuestra comunidad de <em>WhatsApp.</em></h1>
    <div class="intro">
      <p>En la comunidad informaremos del día y la hora de las entrevistas.</p>
      <p>También compartiremos el enlace de Google Meet para que puedas conectarte.</p>
    </div>
    <a class="community-link" href="https://chat.whatsapp.com/DOpB0p7sdQfABm6FYN92aM">Unirme a la comunidad <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
