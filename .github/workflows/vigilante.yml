# Vigilante de la web: cada 15 minutos comprueba que wrealestate.es responde.
# Si falla en tres intentos seguidos (con un minuto entre ellos), abre la incidencia «URGENTE · La web
# wrealestate.es está caída» asignada a agm1212 y enriquecubela, y GitHub les envía un correo con ese asunto
# (a la dirección de notificaciones de cada cuenta). Cuando la web vuelve, la renombra a «RESUELTO · …»,
# la cierra y llega otro correo.
# Mientras siga caída no repite el aviso: la incidencia abierta ya lo dice.
# Al abrir la incidencia lanza el agente de diagnóstico (diagnostico.yml), que añade su análisis
# como comentario (llega también por correo).
# Para probarlo: Actions → «Vigilante de la web» → Run workflow → marcar «Simular una caída».
# OJO: GitHub pausa las tareas programadas de un repositorio público tras 60 días sin cambios;
# si pasa, se reactiva en Actions → «Vigilante de la web» → Enable workflow.
name: Vigilante de la web

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      simular_caida:
        description: 'Simular una caída para probar el aviso'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      incidencia: ${{ steps.aviso.outputs.incidencia }}
    steps:
      - name: Comprobar la web (tres intentos, con un minuto entre ellos)
        id: web
        env:
          SIMULAR: ${{ inputs.simular_caida && 'si' || 'no' }}
        run: |
          # Cada página debe responder 200 y ser de W (no la página de error de GitHub ni la nuestra).
          revisar() {
            local nombre="$1" url="$2" codigo
            codigo=$(curl -sS -L -o pagina.html -w '%{http_code}' --max-time 25 \
              -A 'VigilanteW/1.0 (+https://github.com/Real-Estate-Rocket/w-real-estate-web)' \
              "${url}?vigilante=$(date +%s)" 2>error.txt) || codigo="sin respuesta ($(head -c 160 error.txt | tr '\n' ' '))"
            if [ "$codigo" != "200" ] || ! grep -q '<title>[^<]*W Real Estate' pagina.html; then
              FALLOS+="- ${nombre} (${url}): ${codigo}"$'\n'
            fi
          }
          for intento in 1 2 3; do
            FALLOS=""
            revisar "Portada" "https://wrealestate.es/"
            revisar "Buscador de propiedades" "https://wrealestate.es/comprar/"
            revisar "Portada en inglés" "https://wrealestate.es/en/"
            revisar "Dirección con www" "https://www.wrealestate.es/"
            if [ "$SIMULAR" = "si" ]; then
              FALLOS="- Caída simulada a mano para probar el aviso (la web en realidad funciona)"$'\n'
              break
            fi
            if [ -z "$FALLOS" ]; then break; fi
            echo "Intento $intento con fallos:"
            printf '%s' "$FALLOS"
            if [ "$intento" -lt 3 ]; then sleep 60; fi
          done
          if [ -n "$FALLOS" ]; then
            echo "estado=caida" >> "$GITHUB_OUTPUT"
            { echo "detalle<<FIN_DETALLE"; printf '%s' "$FALLOS"; echo "FIN_DETALLE"; } >> "$GITHUB_OUTPUT"
          else
            echo "Todo correcto."
            echo "estado=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir o cerrar la incidencia «Web caída»
        id: aviso
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ESTADO: ${{ steps.web.outputs.estado }}
          DETALLE: ${{ steps.web.outputs.detalle }}
          EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SIMULAR: ${{ inputs.simular_caida && 'si' || 'no' }}
          AVISAR: agm1212,enriquecubela
        run: |
          gh label create web-caida --color B60205 --description 'Aviso automático del vigilante de la web' >/dev/null 2>&1 || true
          ahora=$(TZ=Europe/Madrid date '+%d/%m/%Y a las %H:%M')
          abierta=$(gh issue list --state open --label web-caida --json number --jq '.[0].number // empty')
          if [ "$ESTADO" = "caida" ]; then
            if [ -n "$abierta" ]; then
              echo "La web sigue caída; la incidencia #$abierta ya está abierta."
              exit 0
            fi
            titulo="URGENTE · La web wrealestate.es está caída"
            if [ "$SIMULAR" = "si" ]; then titulo="PRUEBA · ${titulo}"; fi
            cuerpo="**URGENTE: wrealestate.es no responde** desde el ${ahora} (hora de España). Se ha comprobado tres veces, con un minuto entre intentos.

          Lo que ha fallado:
          ${DETALLE}

          Qué revisar, por orden:
          1. GitHub → Settings → Pages de este repositorio: que «Custom domain» siga siendo wrealestate.es y esté verificado (solo lo puede tocar un administrador de la organización).
          2. Cloudflare → DNS: los cuatro registros A a 185.199.108.153 · 109 · 110 · 111 y el CNAME de www a real-estate-rocket.github.io, todos con la nube gris.
          3. Estado de GitHub: https://www.githubstatus.com

          El agente de diagnóstico añadirá aquí su análisis en unos minutos. Esta incidencia se cierra sola cuando la web vuelva a responder. Comprobación: ${EJECUCION}"
            url=$(gh issue create --title "$titulo" --label web-caida --assignee "$AVISAR" --body "$cuerpo")
            echo "$url"
            echo "incidencia=${url##*/}" >> "$GITHUB_OUTPUT"
          elif [ -n "$abierta" ]; then
            # Nuevo asunto para que el correo de vuelta a la normalidad no se confunda con el urgente.
            gh issue edit "$abierta" --title "RESUELTO · La web wrealestate.es vuelve a funcionar"
            gh issue close "$abierta" --comment "**RESUELTO:** la web vuelve a responder bien desde el ${ahora} (hora de España). Comprobación: ${EJECUCION}"
          else
            echo "Todo correcto; no hay ninguna incidencia abierta."
          fi

  diagnostico:
    needs: comprobar
    if: needs.comprobar.outputs.incidencia != ''
    permissions:
      contents: write
      pull-requests: write
      issues: write
      pages: write
      actions: read
    uses: ./.github/workflows/diagnostico.yml
    with:
      incidencia: ${{ needs.comprobar.outputs.incidencia }}
    secrets: inherit

  # La ejecución se marca en rojo cuando abre una incidencia nueva, para que se vea en Actions.
  marcar:
    needs: [comprobar, diagnostico]
    if: always() && needs.comprobar.outputs.incidencia != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Web caída: incidencia #${{ needs.comprobar.outputs.incidencia }}"
          exit 1
